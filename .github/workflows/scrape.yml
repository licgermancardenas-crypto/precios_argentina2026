name: scrape-diario

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 Argentina (UTC-3)
  workflow_dispatch:        # permite correrlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scrapers (todas las cadenas)
        run: python -m scraper

      - name: Normalizar datos
        run: python -m pipeline.normalize

      - name: Ingestar regresores (dólar)
        run: python -m pipeline.regresores

      - name: Forecast + anomalías
        run: python -m pipeline.forecast   # con <30 días escribe estado "insuficiente" (no requiere Prophet)

      - name: Exportar datos públicos
        run: python -m pipeline.export

      - name: Comparativa vs IPC oficial
        run: python -m pipeline.comparativa_ipc

      - name: Hallazgos publicables
        run: python -m pipeline.hallazgos

      - name: Commitear datos
        run: |
          git config user.name  "atlas-bot"
          git config user.email "bot@atlas-precios"
          git add data/
          git commit -m "datos $(date +%F)" || echo "sin cambios"
          git push
